name: Bug Report
description: Report a bug in this maintained fork
labels:
  - bug
  - upstream
body:
  - type: markdown
    attributes:
      value: |
        Do not use this form to ask about lost codes or accounts!
        Read more [here](https://authenticator.cc/docs/en/lost-codes).
        This repository is a maintained fork. Please mention if the bug is specific to this fork.
  - type: textarea
    attributes:
      label: Describe the issue
      description: Include detailed steps to reproduce the issue if appropriate.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Browser Version
    validations:
      required: true
  - type: input
    attributes:
      label: Extension Version
      description: Please provide the fork release tag (for example, fork-v8.0.3) or the commit hash.
    validations:
      required: true
