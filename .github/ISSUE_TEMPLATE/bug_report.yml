name: 不具合報告
description: このフォークの不具合を報告する
labels:
  - bug
  - upstream
body:
  - type: markdown
    attributes:
      value: |
        コードやアカウントの紛失については、このフォームを使わないでください。
        詳細は[こちら](https://authenticator.cc/docs/en/lost-codes)を読んでください。
        このリポジトリは保守中のフォークです。このフォーク固有の不具合かどうかを書いてください。
  - type: textarea
    attributes:
      label: 不具合の内容
      description: 再現できる場合は、手順も書いてください。
    validations:
      required: true
  - type: dropdown
    attributes:
      label: ブラウザ
      options:
        - Chrome
        - Firefox
        - Edge
        - その他
    validations:
      required: true
  - type: input
    attributes:
      label: ブラウザのバージョン
    validations:
      required: true
  - type: input
    attributes:
      label: 拡張機能のバージョン
      description: フォークのリリースタグ（例: fork-v8.0.3）か、コミットハッシュを書いてください。
    validations:
      required: true
